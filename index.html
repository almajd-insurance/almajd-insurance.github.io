ين عُمان (البطاقة البرتقالية) لكافة المركبات الإماراتية المسافرة إلى عُمان، من أسبوع وحتى سنة."}}, {"@type": "Question", "name": "ماذا أفعل عند وقوع حادث؟", "acceptedAnswer": {"@type": "Answer", "text": "اتبع تعليمات الجهات المختصة أولاً، ثم تواصل معنا على واتساب لنوجّهك ونتابع المطالبة مع شركة التأمين."}}]}</script>
